name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Lets release.yml re-run this suite against the tagged commit. A local-path
  # `uses:` resolves at the caller's commit, so the tag's own copy is what runs.
  workflow_call:

permissions:
  contents: read

jobs:
  smoke:
    name: install.sh smoke (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships bash 3.2.57, the interpreter where the empty-array
          # `set -u` abort actually reproduces. This leg is the one that gives
          # the regression guard its teeth — do not drop it for being slow.
          - os: macos-latest
            label: bash 3.2 (macOS)
            shell_bin: /bin/bash
          # Linux runs bash 5.x, where the abort cannot reproduce. Kept so the
          # rest of the suite is covered on the platform most contributors use;
          # the suite prints a NOTE saying the guard is advisory here.
          - os: ubuntu-latest
            label: bash 5.x (Linux)
            shell_bin: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report interpreter
        env:
          SHELL_BIN: ${{ matrix.shell_bin }}
        run: |
          "$SHELL_BIN" --version | head -1

      - name: Syntax check
        env:
          SHELL_BIN: ${{ matrix.shell_bin }}
        run: |
          "$SHELL_BIN" -n install.sh
          "$SHELL_BIN" -n tests/install-smoke.sh
          "$SHELL_BIN" -n hooks/check-update.sh
          "$SHELL_BIN" -n tests/hook-smoke.sh

      - name: Run smoke suite
        env:
          SHELL_BIN: ${{ matrix.shell_bin }}
        run: |
          "$SHELL_BIN" tests/install-smoke.sh

      - name: Run hook smoke suite
        env:
          SHELL_BIN: ${{ matrix.shell_bin }}
        run: |
          "$SHELL_BIN" tests/hook-smoke.sh

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      # install.sh carries one known SC2294 (`eval "$@"`) behind a documented
      # security invariant, so it is excluded by code rather than by lowering
      # the severity floor for the whole repo.
      - name: Lint
        run: |
          shellcheck -S warning -e SC2294 install.sh
          shellcheck -S warning tests/install-smoke.sh
          shellcheck -S warning hooks/check-update.sh
          shellcheck -S warning tests/hook-smoke.sh

  manifests:
    name: manifests parse
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate JSON and version parity
        run: |
          python3 - <<'PY'
          import json, os, sys

          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          # Parse-only: invalid JSON here would kill every SessionStart.
          json.load(open("hooks/hooks.json"))

          entries = [p for p in market["plugins"] if p["name"] == plugin["name"]]
          if len(entries) != 1:
              sys.exit(
                  f'expected exactly one marketplace entry named '
                  f'{plugin["name"]!r}, found {len(entries)}'
              )
          entry = entries[0]

          bad = []
          if plugin["version"] != entry["version"]:
              bad.append(
                  f'version drift: plugin.json {plugin["version"]} '
                  f'!= marketplace.json {entry["version"]}'
              )
          if entry.get("source") != "./":
              bad.append(
                  f'marketplace source is {entry.get("source")!r}; '
                  'this repo ships the plugin in-tree as "./"'
              )
          for path in ("skills/maestro/SKILL.md", "hooks/check-update.sh", "install.sh"):
              if not os.path.isfile(path):
                  bad.append(
                      f'missing {path} — the manifests reference a payload '
                      'that is not in the tree'
                  )
          if not plugin.get("description") or not plugin.get("homepage"):
              bad.append(
                  "plugin.json is missing description or homepage "
                  "(both are user-facing in /plugin)"
              )

          # --- Skill bundle lint (2026-08-24) -----------------------------
          # Eleven statically-detectable defects shipped before this job
          # existed: dead references, cross-file drift, unresolvable names.
          # Everything below is cheap string checking over the bundle.
          import re

          skill = open("skills/maestro/SKILL.md", encoding="utf-8").read()

          # Frontmatter: parse the leading --- block by hand (no yaml dep)
          fm = re.match(r"\A---\n(.*?)\n---\n", skill, re.S)
          if not fm:
              bad.append("SKILL.md has no leading frontmatter block")
          else:
              fm_name = re.search(r"^name:\s*(\S+)\s*$", fm.group(1), re.M)
              if not fm_name or fm_name.group(1) != plugin["name"]:
                  bad.append(
                      "SKILL.md frontmatter name "
                      f"{fm_name.group(1) if fm_name else None!r} != plugin.json "
                      f"name {plugin['name']!r}"
                  )
              if not re.search(r"^description:\s*\S", fm.group(1), re.M):
                  bad.append("SKILL.md frontmatter has no description")

          # Every references/*.md the skill points at must exist in the bundle
          for ref in sorted(set(re.findall(r"references/[a-z0-9-]+\.md", skill))):
              if not os.path.isfile(os.path.join("skills/maestro", ref)):
                  bad.append(f"SKILL.md references missing file {ref}")

          # hooks.json command paths must resolve in-tree
          hooks = json.load(open("hooks/hooks.json"))
          for event in hooks.get("hooks", {}).values():
              for group in event:
                  for h in group.get("hooks", []):
                      for m in re.findall(
                          r"\$\{CLAUDE_PLUGIN_ROOT\}/(\S+?)[\"']",
                          h.get("command", ""),
                      ):
                          if not os.path.isfile(m):
                              bad.append(
                                  f"hooks.json references missing script {m}"
                              )

          # check-update.sh must point at the repo the manifests name
          hook_src = open("hooks/check-update.sh", encoding="utf-8").read()
          hook_repo = re.search(r'^REPO="([^"]+)"', hook_src, re.M)
          manifest_repo = plugin.get("repository", "")
          if not hook_repo or hook_repo.group(1) not in manifest_repo:
              bad.append(
                  "check-update.sh REPO "
                  f"{hook_repo.group(1) if hook_repo else None!r} does not "
                  f"match plugin.json repository {manifest_repo!r}"
              )

          # Hot-path word ceiling. README's token-discipline paragraph
          # accounts for every overspend; this makes silent drift impossible.
          # Raising the ceiling is a visible diff needing a justification,
          # which is exactly the discipline CONTRIBUTING.md asks for.
          WORD_CEILING = 6500
          words = len(skill.split())
          if words > WORD_CEILING:
              bad.append(
                  f"SKILL.md is {words} words, over the {WORD_CEILING} "
                  "ceiling; trim it or raise the ceiling with justification"
              )

          if bad:
              sys.exit("manifest problems:\n  " + "\n  ".join(bad))
          print(f'manifests consistent at {plugin["version"]}')
          PY

  # Single stable name for branch protection to require. The matrix job names
  # are prose ("install.sh smoke (bash 3.2 (macOS))") and change with labels;
  # pinning protection to this one aggregator means adding or renaming jobs
  # only ever touches this needs: list, never repo settings.
  ci-ok:
    name: ci-ok
    # Runs even when a dependency fails: a job skipped by a failed `needs` is
    # reported as neutral to branch protection, which would let a red PR merge.
    # `!cancelled()` rather than `always()` so a deliberately cancelled run
    # does not also paint a red ci-ok on top of the cancellation.
    if: ${{ !cancelled() }}
    needs: [smoke, shellcheck, manifests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert every required job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$NEEDS"
          FAILED=$(printf '%s' "$NEEDS" | jq -r '
            [to_entries[] | select(.value.result != "success")
             | "\(.key)=\(.value.result)"] | join(", ")')
          if [ -n "$FAILED" ]; then
            echo "::error::required jobs did not succeed: $FAILED"
            exit 1
          fi
