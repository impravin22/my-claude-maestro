<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Form that resets</title><style>button,input{font:inherit;min-height:44px;min-width:44px}[hidden]{display:none!important}</style></head><body><main><h1>Form that resets</h1>
<form id="f"><label>Name <input name="name"></label> <label>Email <input name="email" type="email"></label> <button type="submit">Send</button></form>
</main><script>
f.onsubmit = async (e) => { e.preventDefault(); const r = await fetch('/ux-api', { method: 'POST', body: new FormData(f) }); if (!r.ok) f.reset(); };
</script></body></html>
