<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dev overlay</title><style>body{margin:0;font:16px sans-serif;background:#fff;color:#111}.b{min-width:44px;min-height:44px;padding:0 12px}:focus-visible{outline:3px solid #000;outline-offset:2px}</style></head><body><main><h1>Page with a dev overlay</h1>
<button class="b" type="button" onclick="this.textContent='Saved'">Save changes</button></main>

</script></body></html>
